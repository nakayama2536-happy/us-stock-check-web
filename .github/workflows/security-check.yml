name: Public Repository Safety Check
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject likely secrets or private investment values
        shell: bash
        run: |
          set -euo pipefail
          # README may describe prohibited fields as policy; scan deployable/runtime content instead.
          TARGETS="docs"
          if grep -RInE --exclude='security-check.yml' '(OPENAI_API_KEY|TWELVEDATA_API_KEY|github_pat_|sk-[A-Za-z0-9_-]{20,}|position_size[[:space:]]*[:=]|cost_basis[[:space:]]*[:=])' $TARGETS; then
            echo "Potential private/sensitive value found in public content."
            exit 1
          fi
          echo "Public safety scan passed."
