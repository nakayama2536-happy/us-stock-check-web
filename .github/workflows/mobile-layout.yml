name: Mobile overview candidate (unpublished)

on:
  pull_request:
    branches: [main]
    paths:
      - 'adoption/**'
      - '.github/workflows/mobile-layout.yml'

permissions:
  contents: read

jobs:
  mobile-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify display-only diff and reject unsafe inputs
        run: node --test adoption/mobile-layout.test.cjs
      - name: Install browser testing dependency
        run: python -m pip install playwright==1.57.0
      - name: Test compact viewport, navigation and unchanged failure handling
        env:
          PUBLIC_REVISION: ${{ github.event.pull_request.head.sha }}
        run: python adoption/browser_mobile.py
      - name: Preserve normal PWA and fixed preview bytes
        run: git diff --exit-code -- docs/
      - name: Retain fixture-only evidence, never deploy
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: us-mobile-layout-evidence
          path: test-output-mobile/
          if-no-files-found: error
          retention-days: 7
