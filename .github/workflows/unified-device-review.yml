name: US daily five-tab review safety (isolated, read-only)

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/preview/unified-daily/**'
      - 'tests/check_unified_device_review.py'
      - 'tests/browser_unified_device_review.py'
      - '.github/workflows/unified-device-review.yml'
      - '.github/workflows/deploy-pages.yml'
  push:
    branches: [main]
    paths:
      - 'docs/preview/unified-daily/**'
      - 'tests/check_unified_device_review.py'
      - 'tests/browser_unified_device_review.py'
      - '.github/workflows/unified-device-review.yml'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Approved Git blobs and review-only privacy gate
        run: |
          python tests/check_unified_device_review.py
          node --check docs/preview/unified-daily/app.js
          node --check docs/preview/unified-daily/unified-ui.js
      - name: Protect normal root, daily JSON and existing device preview
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_BASE_REF" --depth=1
          for path in docs/index.html docs/app.js docs/style.css docs/sw.js docs/manifest.webmanifest docs/data docs/preview/connected docs/preview/device docs/preview/s1; do
            git diff --quiet FETCH_HEAD HEAD -- "$path" ||
              { echo "::error::Normal root or existing preview changed: $path"; exit 1; }
          done
      - name: Install browser dependencies and Japanese font
        run: |
          python -m pip install playwright==1.57.0
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Test five tabs with current root JSON, and protect original root state
        run: python tests/browser_unified_device_review.py
      - name: Keep scoped browser evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: us-unified-daily-device-review
          path: test-output-unified-review/
          if-no-files-found: error
          retention-days: 7
