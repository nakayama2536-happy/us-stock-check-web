name: Cache Contract
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/sw.js'
      - 'tests/sw-cache.test.cjs'
      - '.github/workflows/cache-contract.yml'
  push:
    branches: [main]
    paths:
      - 'docs/sw.js'
      - 'tests/sw-cache.test.cjs'
      - '.github/workflows/cache-contract.yml'
permissions:
  contents: read
jobs:
  cache-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: node --check docs/sw.js
      - run: node --test tests/sw-cache.test.cjs
