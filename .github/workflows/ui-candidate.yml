name: US UI Candidate
on:
  push:
    branches: [feature/us-ui-s1-candidate-20261004]
  pull_request:
    branches: [main]
    paths:
      - 'candidate/**'
      - 'scripts/build_ui_candidate.py'
      - 'tests/experience.test.cjs'
      - 'tests/browser_candidate.py'
      - '.github/workflows/ui-candidate.yml'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: State and legacy cache tests
        run: node --test tests/experience.test.cjs tests/sw-cache.test.cjs
      - name: Build isolated candidate and verify source/data bytes unchanged
        run: |
          python scripts/build_ui_candidate.py
          node --check build/us-ui-s1/app.js
          node --check build/us-ui-s1/experience.js
          node --check build/us-ui-s1/boot.js
      - name: Install pinned browser test driver
        run: python -m pip install playwright==1.57.0
      - name: Chromium integration and small-screen checks
        run: python tests/browser_candidate.py
      - name: Candidate evidence only - no Pages deployment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: us-ui-s1-candidate
          path: |
            build/us-ui-s1/
            test-output/
          retention-days: 7
