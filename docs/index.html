<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b2a53">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="米国株">
  <title>米国株 投資チェック</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/us-stock-icon.png">
  <link rel="icon" href="./icons/us-stock-icon.png" type="image/png">
  <link rel="stylesheet" href="./style.css?v=0.9.5">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="hero-row">
        <img class="app-icon" src="./icons/us-stock-icon.png" alt="米国株アプリ">
        <div class="hero-title">
          <div class="eyebrow">US STOCK CHECK</div>
          <h1>米国株 投資チェック</h1>
          <div id="version" class="version">v0.9.5</div>
        </div>
      </div>

      <div class="status-compact">
        <div id="stateBox" class="status-box status-primary">
          <span>状態</span>
          <strong id="appState">準備中</strong>
        </div>
        <div class="status-meta">
          <div><span>取引日</span><strong id="tradeDate">—</strong></div>
          <div><span>更新</span><strong id="updatedAt">—</strong></div>
        </div>
      </div>

      <button id="refreshButton" class="refresh-button" type="button">
        <span class="refresh-icon">↻</span> 最新データ取得
      </button>
      <div id="refreshNote" class="refresh-note">公開済みの最新データを再取得します。</div>
    </header>

    <section>
      <h2>ダイジェスト</h2>
      <div id="digest" class="card muted">最新データを読み込み中です。</div>
    </section>

    <section>
      <h2>主要4銘柄</h2>
      <div id="stocks" class="cards"></div>
    </section>

    <section>
      <h2>市場環境</h2>
      <div id="market" class="cards compact"></div>
    </section>

    <section>
      <h2>モデル検証</h2>
      <div id="modelValidation" class="card muted">Point-in-Time検証データ待ちです。</div>
    </section>

    <section>
      <h2>データ品質</h2>
      <div id="quality" class="card"></div>
      <div class="legend card">
        <div class="legend-row"><span class="quality-pill pass">正常</span><span>確認済み・正常</span></div>
        <div class="legend-row"><span class="quality-pill pending">確認待ち</span><span>独立確認待ち。Primary確定値は利用可能</span></div>
        <div class="legend-row"><span class="quality-pill fail">要確認</span><span>確認が必要</span></div>
      </div>
    </section>

    <section id="noticesSection" class="hidden">
      <h2>確認事項</h2>
      <div id="notices" class="card notice-card"></div>
    </section>

    <footer>
      検証運用 / 自動売買なし<br>
      <span class="footer-sub">表示は定量監視用。売買判断は他の確認項目と併用。</span>
    </footer>
  </main>

  <script src="./app.js?v=0.9.5" defer></script>
</body>
</html>
